# Infraestructura del proyecto Smart Health.
# Por ahora: MongoDB. La API y Node-RED se añaden el sábado 14 (compose final).
#
#   docker compose up -d     -> levanta MongoDB en localhost:27017
#   docker compose down      -> lo para (los datos se conservan en el volumen)
#
# Mosquitto NO va en Docker: usamos el Mosquitto nativo (servicio de Windows)
# en localhost:1883, con la configuración de mosquitto/ (la prepara A).

services:
  mongo:
    image: mongo:8
    container_name: smarthealth-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

volumes:
  mongo-data:
