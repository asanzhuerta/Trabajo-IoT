# Infraestructura del proyecto Smart Health: solo MongoDB.
#
#   docker compose up -d     -> levanta MongoDB en localhost:27017
#   docker compose down      -> lo para (los datos se conservan en el volumen)
#
# Mosquitto, Node-RED y la API van instalados en local, no en Docker. Mosquitto usa la
# configuración de mosquitto/ (ver TUTORIAL_DEV.md).

services:
  mongo:
    image: mongo:8
    container_name: smarthealth-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

volumes:
  mongo-data:
